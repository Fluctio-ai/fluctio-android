# CI build: every push to main produces the release APK as a workflow
# artifact. Tag pushes still go through release.yml, which publishes the
# signed APK as a GitHub Release (the app's update checker reads that).
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5

      - name: Build release APK
        env:
          # Match pubspec.lock's hosted URLs so pub installs the locked
          # versions instead of re-resolving against pub.dev.
          PUB_HOSTED_URL: https://pub.flutter-io.cn
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
          # Signing material lives in Actions secrets; the keystore is
          # decoded back into place just for this build.
          FLUCTIO_KEYSTORE_BASE64: ${{ secrets.FLUCTIO_KEYSTORE_BASE64 }}
          FLUCTIO_KEYSTORE_PROPS: ${{ secrets.FLUCTIO_KEYSTORE_PROPS }}
        run: |
          echo "$FLUCTIO_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: fluctio-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
