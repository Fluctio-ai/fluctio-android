# Release pipeline (ticket 12): tag push (v*) builds a signed release APK
# and publishes it as a GitHub Release; the app's update checker reads
# the same release (latest) and opens the browser_download_url.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5

      - name: Build release APK
        env:
          # Signing material lives in Actions secrets; the keystore is
          # decoded back into place just for this build.
          FLUCTIO_KEYSTORE_BASE64: ${{ secrets.FLUCTIO_KEYSTORE_BASE64 }}
          FLUCTIO_KEYSTORE_PROPS: ${{ secrets.FLUCTIO_KEYSTORE_PROPS }}
        run: |
          echo "$FLUCTIO_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          # The checked-in lock carries the CN mirror URLs (local dev is
          # mirror-bound), but the runner downloads from pub.dev directly —
          # rewrite the hosted URLs only (versions and content hashes are
          # URL-independent) and enforce the lockfile, so pub installs
          # exactly the locked versions without re-resolving against a
          # different host. The v1.1.7 build died on the mirror's corrupted
          # file_selector_platform_interface-2.7.0 archive hash; pub.dev is
          # the source of truth, so download from it.
          sed -i 's#https://pub.flutter-io.cn#https://pub.dev#g' pubspec.lock
          flutter pub get --enforce-lockfile
          flutter build apk --release

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            build/app/outputs/flutter-apk/app-release.apk#fluctio.apk
